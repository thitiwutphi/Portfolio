version: 2
updates:
  # npm/bun dependencies are not covered: Dependabot can't read Bun 1.4's bun.lock (lockfile v2) yet.
  # Update them with `bun update` and let CI verify, or re-add a `bun` entry once Dependabot supports it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
